version: '3.8'

services:
  auth-db:
    image: postgres:16
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - auth_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  task-db:
    image: postgres:16
    environment:
      POSTGRES_DB: task_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - task_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"

  notif-db:
    image: postgres:16
    environment:
      POSTGRES_DB: notif_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - notif_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  auth-service:
    build: ./auth-service
    ports:
      - "8002:8002"
    environment:
      SECRET_KEY: ${SECRET_KEY}
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: auth-db
    depends_on:
      - auth-db
      - redis

  task-service:
    build: ./task-service
    ports:
      - "8003:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY}
      POSTGRES_DB: task_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: task-db
    depends_on:
      - task-db
      - redis

  notification-service:
    build: ./notification-service
    ports:
      - "8004:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY}
      POSTGRES_DB: notif_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: notif-db
    depends_on:
      - notif-db
      - redis

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - auth-service
      - task-service
      - notification-service

volumes:
  auth_data:
  task_data:
  notif_data:
