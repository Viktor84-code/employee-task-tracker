services:
  auth-db:
    image: postgres:16
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - auth_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  task-db:
    image: postgres:16
    environment:
      POSTGRES_DB: task_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - task_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  notif-db:
    image: postgres:16
    environment:
      POSTGRES_DB: notif_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - notif_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  auth-service:
    build: ./auth-service
    ports:
      - "8002:8002"
    environment:
      SECRET_KEY: ${SECRET_KEY}
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: auth-db
    command: sh -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8002 --workers 3"
    depends_on:
      auth-db:
        condition: service_healthy
      redis:
        condition: service_started

  task-service:
    build: ./task-service
    ports:
      - "8003:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY}
      POSTGRES_DB: task_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: task-db
    command: sh -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    depends_on:
      task-db:
        condition: service_healthy
      redis:
        condition: service_started

  notification-service:
    build: ./notification-service
    ports:
      - "8004:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY}
      POSTGRES_DB: notif_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: notif-db
    command: sh -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    depends_on:
      notif-db:
        condition: service_healthy
      redis:
        condition: service_started

  notification-worker:
    build: ./notification-service
    command: celery -A config worker -l info
    environment:
      SECRET_KEY: ${SECRET_KEY}
      POSTGRES_DB: notif_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: notif-db
    depends_on:
      notif-db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - auth-service
      - task-service
      - notification-service

volumes:
  auth_data:
  task_data:
  notif_data:
